<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Cuadrado Redondeado Premium -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Aro Exterior de Lente Óptico -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#blueGrad)" stroke-width="8" stroke-dasharray="14 10" opacity="0.6" />
  <circle cx="256" cy="256" r="162" fill="rgba(15, 23, 42, 0.7)" stroke="url(#goldGrad)" stroke-width="5" />

  <!-- Diafragma de Apertura de Cámara (Láminas) -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="3" fill="none">
    <path d="M 256 100 L 370 210" />
    <path d="M 370 210 L 340 370" />
    <path d="M 340 370 L 190 390" />
    <path d="M 190 390 L 130 270" />
    <path d="M 130 270 L 256 100" />
  </g>

  <!-- Letra "B" Monograma Estilizada con Enfoque de Lente -->
  <g filter="url(#glow)">
    <!-- Tronco vertical de la B -->
    <path d="M 196 150 L 196 362" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Lóbulo superior de la B -->
    <path d="M 196 162 C 265 162, 310 185, 310 236 C 310 275, 275 292, 196 292" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Lóbulo inferior de la B -->
    <path d="M 196 288 C 285 288, 330 305, 330 350 C 330 398, 275 410, 196 410" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, -48)" />

    <!-- Destello Central / Punto de Enfoque (Snap) -->
    <circle cx="316" cy="180" r="12" fill="#ffffff" />
    <polygon points="316,145 322,175 352,180 322,185 316,215 310,185 280,180 310,175" fill="url(#goldGrad)" />
  </g>

  <!-- Acento de Obturador Cyan -->
  <circle cx="256" cy="256" r="38" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.5" />
</svg>