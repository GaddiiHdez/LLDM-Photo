name: Construir BereaSnap APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    env:
      CAPACITOR_TELEMETRY: "false"

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (JDK Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Aceptar Licencias y Configurar Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Otorgar Permisos de Ejecución a Gradle
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Configurar Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias Web y Capacitor
        run: npm install

      - name: Compilar Aplicación Web (Vite + Tipografías Offline)
        run: npm run build

      - name: Sincronizar con Proyecto Android (Capacitor Sync)
        run: |
          mkdir -p android/app/src/main/assets/public
          set +e
          OUTPUT=$(npm run cap:sync 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error title=Capacitor Sync Error::$(echo "$OUTPUT" | tr '\n' ' ')"
            echo "### ❌ Error en Capacitor Sync" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi
          set -e

      - name: Compilar APK Android (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Obtener Versión Semántica del Proyecto
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          echo "APP_VER=$APP_VER" >> $GITHUB_ENV

      - name: Preparar y Nombrar Archivos APK
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/BereaSnap-v${{ env.APP_VER }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/BereaSnap.apk

      - name: Publicar Archivo APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: BereaSnap-v${{ env.APP_VER }}-APK
          path: output-apk/BereaSnap-v${{ env.APP_VER }}.apk
          retention-days: 30

      - name: Crear Release Automático con APK Adjunto
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.APP_VER }}
          name: BereaSnap v${{ env.APP_VER }} (Compilación ${{ github.run_number }})
          body: |
            ## 📸 BereaSnap v${{ env.APP_VER }} - Suite Fotográfica Pro & Flujo de Trabajo

            ¡La actualización **v${{ env.APP_VER }}** de BereaSnap ya está disponible!

            ### ✨ Novedades Principales:
            - 🎛️ **Herramientas Fotográficas Pro**: Nuevo slider de Claridad / Textura para resaltar detalles eclesiásticos, Protector de Piel IA (*Skin Tone Guard*) que previene rostros anaranjados, Reducción de Ruido para tomas nocturnas/ISO alto y Regla de Tercios 3×3 con puntos dorados en encuadre.
            - 🔄 **Flujo de Trabajo Profesional**: Deshacer y Rehacer paso a paso (`↺` y `↻` con soporte Ctrl+Z / Ctrl+Y), Exportación e Importación de Presets de usuario en archivo `.json` para compartir entre fotógrafos, Histograma multiespectral RGB en tiempo real y Cebras de sobreexposición (*Zebra Blinkies*) para no quemar túnicas blancas de coro ni lámparas.
            - 💾 **Almacenamiento Persistente & 1-Toque**: Guardado automático de sesión en segundo plano (IndexedDB) para recuperar todas tus fotos y ajustes si sales de la app o entra una llamada. Nuevos perfiles de guardado con 1 toque (*Máxima Calidad Original* vs *Optimizado WhatsApp*).
            - 💎 **Nuevo Icono Oficial Flat B+S**: Monograma estilizado y limpio en oro imperial sobre fondo negro puro AMOLED.
            
            ### 📥 Instrucciones de Instalación:
            1. Descarga el archivo `BereaSnap-v${{ env.APP_VER }}.apk` o `BereaSnap.apk`.
            2. Abre la descarga en tu teléfono Android e instálala directamente sobre tu versión anterior.
            3. ¡Listo! Todo tu estudio fotográfico offline al alcance de tu mano.
          files: |
            output-apk/BereaSnap-v${{ env.APP_VER }}.apk
            output-apk/BereaSnap.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
