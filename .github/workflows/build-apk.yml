name: Construir BereaSnap APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    env:
      CAPACITOR_TELEMETRY: "false"

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (JDK Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Aceptar Licencias y Configurar Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Otorgar Permisos de Ejecución a Gradle
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Configurar Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias Web y Capacitor
        run: npm install

      - name: Compilar Aplicación Web (Vite + Tipografías Offline)
        run: npm run build

      - name: Sincronizar con Proyecto Android (Capacitor Sync)
        run: |
          mkdir -p android/app/src/main/assets/public
          set +e
          OUTPUT=$(npm run cap:sync 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error title=Capacitor Sync Error::$(echo "$OUTPUT" | tr '\n' ' ')"
            echo "### ❌ Error en Capacitor Sync" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi
          set -e

      - name: Compilar APK Android (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Obtener Versión Semántica del Proyecto
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          echo "APP_VER=$APP_VER" >> $GITHUB_ENV

      - name: Preparar y Nombrar Archivos APK
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/BereaSnap-v${{ env.APP_VER }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/BereaSnap.apk

      - name: Publicar Archivo APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: BereaSnap-v${{ env.APP_VER }}-APK
          path: output-apk/BereaSnap-v${{ env.APP_VER }}.apk
          retention-days: 30

      - name: Crear Release Automático con APK Adjunto
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.APP_VER }}
          name: BereaSnap v${{ env.APP_VER }} (Compilación ${{ github.run_number }})
          body: |
            ## 📱 BereaSnap v${{ env.APP_VER }} - Rediseño Samsung One UI & AMOLED Puro

            ¡La actualización mayor **v${{ env.APP_VER }}** de BereaSnap está lista para instalar!

            ### ✨ Novedades Principales:
            - 🖤 **Fondo Negro Puro AMOLED (#000000)**: Canvas y paneles diseñados con contraste total y máximo ahorro de batería para pantallas OLED/AMOLED.
            - 🎛️ **Diales Circulares One UI**: Selección de brillo, contraste, sombras, altas luces, calidez y saturación en diales táctiles con valor central en dial activo.
            - 📏 **Regla Graduada Táctica (Haptic Ruler)**: Deslizador analógico a 120 FPS con aguja de referencia central y marcas milimétricas.
            - 🖼️ **Marco y Firma Unificados**: Sección de identidad combinada con el marco oficial Centenario dinámico de máxima calidad.
            - 🧭 **Barra Superior One UI**: Botón "Revertir" dinámico cuando hay cambios, contador de foto activa y menú de tres puntos (⋮).
            - ⚡ **Dock Flotante Persistente**: Cambio instantáneo entre Auto, Encuadre, Filtros, Ajustes, Marco y Carrete.
            
            ### 📥 Instrucciones de Instalación:
            1. Descarga el archivo `BereaSnap-v${{ env.APP_VER }}.apk` en tu dispositivo Android.
            2. Tócalo en tus Descargas para instalar (si Android te pregunta, permite "Instalar aplicaciones de fuentes desconocidas").
            3. ¡Listo! Abre BereaSnap y disfruta de tu propio estudio fotográfico en el bolsillo.
          files: |
            output-apk/BereaSnap-v${{ env.APP_VER }}.apk
            output-apk/BereaSnap.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
