<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var saved = localStorage.getItem('lldm_studio_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = saved;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/jpeg" href="/logo-bereasnap-icon.jpg" />
    <link rel="apple-touch-icon" href="/logo-bereasnap-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BereaSnap — Estudio Fotográfico Offline</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
